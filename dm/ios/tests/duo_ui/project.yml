name: DuoUIPreview
options:
  deploymentTarget:
    iOS: "27.1"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_OBJC_ARC: YES
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    HEADER_SEARCH_PATHS:
      - $(SRCROOT)/../../Sources
      - $(SRCROOT)/../../../host
      - $(SRCROOT)/Fixtures
      - $(SRCROOT)/../../../gfx
      - $(SRCROOT)/../../../gfx/nvn
targets:
  DuoUIPreview:
    type: application
    platform: iOS
    sources:
      - path: ../../Sources
        excludes: [main.m]
      - path: PreviewHost.m
      - path: PreviewMetal.m
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.nxnative.duo-ui-preview
      TARGETED_DEVICE_FAMILY: "1,2"
      SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/../../Sources/DmIOS-Bridging-Header.h
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 合并触控测试
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        DMLanguage: zh-Hans
        DMShowFPS: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
  DuoGeometryTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GeometryTests.m, TouchTests.m, RuntimeLayoutTests.m, PhysicalInputEditingTests.m, ReflectionTests.m, AngleReflectionTests.m, ReflectionTuningTests.m]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.nxnative.duo-ui-preview.tests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DuoUIPreview
schemes:
  DuoUIPreview:
    build:
      targets:
        DuoUIPreview: all
    test:
      targets: [DuoGeometryTests]
